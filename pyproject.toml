[project]
name = "bluefish-qq-bot"
version = "1.0.0"
description = "群级隔离的 QQ 养成机器人"
requires-python = "==3.12.*"
dependencies = [
    "nonebot2[websockets]>=2.3,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "aiosqlite>=0.20,<1",
    "jieba>=0.42.1,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

